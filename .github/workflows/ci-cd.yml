
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.yash070629 }}
          password: ${{ secrets.dckr pat ucE46sasloc4A1BF@vadDbnZL98 }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.yash070629 }}/calculator-app:latest
            ${{ secrets.yash070629 }}/calculator-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deployment simulation
        run: |
          echo "Docker image built and pushed successfully."
          echo "Image: ${{ secrets.yash070629 }}/calculator-app:latest"
          echo "Configure a deployment server to restart the running container."
